packages:
  - packages/*

autoInstallPeers: true
linkWorkspacePackages: false

# Published SDK declarations cross-reference SDK packages that are dev-only upstream.
# Make the explicit SDK dependency set visible from those declarations as well.
publicHoistPattern:
  - '@deepseek-ai/*'

# Keep wire schemas on one Zod ABI across the plugin and published SDK.
overrides:
  zod: 4.4.3
  # Caret prerelease ranges otherwise select newer RC helpers than the host SDK.
  '@deepseek-ai/dsh-brand': 0.1.2-alpha.5
  '@deepseek-ai/dsh-deque': 0.1.2-alpha.5
  '@deepseek-ai/dsh-scope': 0.1.2-alpha.5
  '@deepseek-ai/dsh-system-prompt': 0.1.2-alpha.5
  '@deepseek-ai/dsh-timeout': 0.1.2-alpha.5
  '@deepseek-ai/dsh-util-crypto': 0.1.2-alpha.5
  '@deepseek-ai/dsh-util-values': 0.1.2-alpha.5

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

allowBuilds:
  esbuild: true
  # SDK native runtime providers are not needed to build this plugin.
  koffi: false
  node-pty: false
